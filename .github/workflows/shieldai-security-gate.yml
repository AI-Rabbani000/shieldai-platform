name: ShieldAI Security Gate

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  client-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_security_gate_client.py' -v

  security-gate:
    name: ShieldAI Security Scan and Gate
    runs-on: ubuntu-latest
    needs: client-contracts
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Request a validated security verdict
        id: gate
        env:
          SHIELDAI_GATE_URL: ${{ secrets.SHIELDAI_GATE_URL }}
          SHIELDAI_GATE_AUTHORIZATION: ${{ secrets.SHIELDAI_GATE_AUTHORIZATION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/security_gate_client.py gate

  autofix-trigger:
    name: Request policy-approved AutoFix
    runs-on: ubuntu-latest
    needs: security-gate
    if: ${{ always() && needs.security-gate.outputs.verdict == 'blocked' && vars.SHIELDAI_AUTOFIX_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Request fixes only for a validated blocking verdict
        env:
          SHIELDAI_AUTOFIX_URL: ${{ secrets.SHIELDAI_AUTOFIX_URL }}
          SHIELDAI_AUTOFIX_AUTHORIZATION: ${{ secrets.SHIELDAI_AUTOFIX_AUTHORIZATION }}
          GATE_VERDICT: ${{ needs.security-gate.outputs.verdict }}
          AUTOFIX_ENABLED: ${{ vars.SHIELDAI_AUTOFIX_ENABLED }}
        run: python scripts/security_gate_client.py autofix
